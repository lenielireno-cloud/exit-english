<title>Exit English</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lista de "saídas" estilo placa de rodovia americana -> tela de digitação com tradução revelada abaixo */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#13201B; --muted:#5E6E67; --line:#D7DFDB;
  --sign:#0B6B47; --sign-ink:#FFFFFF; --ok:#137A3E; --bad:#C2352B; --pend:#9AA8A2; --pt:#2C4A9A;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211D; --ink:#E7EEEA; --muted:#93A39C; --line:#2A3832;
  --sign:#14875C; --sign-ink:#FFFFFF; --ok:#4CC27E; --bad:#FF7A6E; --pend:#5E6E67; --pt:#9DB5FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211D; --ink:#E7EEEA; --muted:#93A39C; --line:#2A3832;
  --sign:#14875C; --sign-ink:#FFFFFF; --ok:#4CC27E; --bad:#FF7A6E; --pend:#5E6E67; --pt:#9DB5FF; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1{font:800 clamp(28px,7vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--sign)}
.sub{color:var(--muted);margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:700 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat{margin-left:auto;font:600 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.exit{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--sign);color:var(--sign-ink);border:2px solid var(--sign);outline:2px solid var(--sign-ink);outline-offset:-6px;border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit}
.exit:focus-visible{box-shadow:0 0 0 3px var(--ink)}
.exit .num{font:700 12px/1.1 var(--mono);text-transform:uppercase;letter-spacing:.08em;border:1.5px solid currentColor;border-radius:4px;padding:6px 7px;text-align:center;min-width:58px}
.exit .num b{display:block;font:800 20px var(--display);letter-spacing:0}
.exit .t{min-width:0;flex:1}
.exit .t strong{display:block;font:700 17px/1.25 var(--display)}
.exit .t small{opacity:.85;font-size:13px}
.exit .done{font:700 12px var(--mono);background:var(--sign-ink);color:var(--sign);border-radius:4px;padding:3px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.panel h2{font:700 18px var(--display);margin:0}
label{font:700 13px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
textarea,input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;font:17px/1.5 var(--mono)}
textarea:focus,input:focus{outline:none;border-color:var(--sign)}
.btn{background:var(--sign);color:var(--sign-ink);border:none;border-radius:8px;padding:10px 16px;font:700 15px var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:14px;color:var(--muted)}
.lesson-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lesson-head h2{font:800 24px/1.15 var(--display);margin:0;flex:1;min-width:0;text-wrap:balance}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sign);width:0;transition:width .25s}
.sent{display:grid;gap:4px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sent:last-child{border-bottom:none}
.en{font:17px/1.6 var(--mono);word-break:break-word}
.en .ok{color:var(--ok)} .en .bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent);border-radius:2px} .en .p{color:var(--pend)}
.en.donee{color:var(--ink)}
.pt{color:var(--pt);font-size:16px;min-height:1.5em}
.pt .h{color:transparent;background:var(--line);border-radius:3px}
.cur{background:color-mix(in srgb,var(--sign) 7%,transparent);border-radius:8px;padding:10px;border-bottom:none}
.hint{font-size:13px;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.say{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:14px;cursor:pointer;margin-left:6px;vertical-align:middle}
.lvl{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.who{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.who.you{color:var(--sign)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .chip:disabled{opacity:.5;cursor:default}
.ask{font:600 15px var(--body);color:var(--pt);background:color-mix(in srgb,var(--pt) 8%,transparent);border-radius:6px;padding:6px 10px}
#ans.okk{border-color:var(--ok)} #ans.bad{border-color:var(--bad)}
.pill{font:700 13px var(--mono);background:var(--sign);color:var(--sign-ink);border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.finish{background:var(--sign);color:var(--sign-ink);outline:2px solid var(--sign-ink);outline-offset:-7px;border-radius:12px;padding:22px 18px;display:grid;gap:10px;text-align:center;animation:pop .45s ease-out}
.finish h3{font:800 26px/1.1 var(--display);margin:0}
.finish .big{font:800 34px var(--display)}
.finish p{margin:0;opacity:.9}
.finish .row{justify-content:center}
.finish .btn{background:var(--sign-ink);color:var(--sign)}
.finish .btn.ghost{background:transparent;color:var(--sign-ink);border-color:var(--sign-ink)}
.prog.full i{background:var(--ok);animation:flash .5s 3}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
@keyframes flash{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.finish,.prog.full i{animation:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<script>
const L=[
// ---------- BÁSICO ----------
["Primeiro dia no trabalho","b",[
["Hi, my name is Carlos and I am from Brazil.","Oi, meu nome é Carlos e eu sou do Brasil."],
["Today is my first day here.","Hoje é meu primeiro dia aqui."],
["Nice to meet you. I'm Jenny, your supervisor.","Prazer em conhecer você. Eu sou a Jenny, sua supervisora."],
["Where should I put my bag?","Onde eu devo colocar minha bolsa?"],
["You can use the locker in the break room.","Você pode usar o armário na sala de descanso."]]],
["Pedindo um café","b",[
["Good morning! What can I get for you?","Bom dia! O que posso trazer para você?"],
["Can I have a medium coffee, please?","Pode me dar um café médio, por favor?"],
["Sure. Would you like milk or sugar?","Claro. Você quer leite ou açúcar?"],
["Just a little milk, thank you.","Só um pouco de leite, obrigado."],
["That will be three dollars and fifty cents.","Vai ficar três dólares e cinquenta centavos."]]],
["No supermercado","b",[
["Excuse me, where can I find the rice?","Com licença, onde eu encontro o arroz?"],
["It's in aisle five, next to the beans.","Fica no corredor cinco, ao lado do feijão."],
["Do you have a store card?","Você tem cartão da loja?"],
["No, I don't. Can I pay with a debit card?","Não, não tenho. Posso pagar com cartão de débito?"],
["Yes, just insert it here.","Sim, é só inserir aqui."]]],
["Pegando o ônibus","b",[
["Does this bus go to downtown?","Este ônibus vai para o centro?"],
["Yes, it stops at Main Street.","Sim, ele para na Main Street."],
["How much is the fare?","Quanto custa a passagem?"],
["It's two dollars, and you need exact change.","São dois dólares, e você precisa do valor exato."],
["Please tell me when we get to my stop.","Por favor, me avise quando chegarmos no meu ponto."]]],
["Pedindo direções","b",[
["Excuse me, I'm looking for the post office.","Com licença, estou procurando os correios."],
["Go straight for two blocks.","Siga em frente por dois quarteirões."],
["Then turn left at the traffic light.","Depois vire à esquerda no semáforo."],
["It's across the street from the bank.","Fica do outro lado da rua, em frente ao banco."],
["Is it far from here?","É longe daqui?"],
["No, it's about a five-minute walk.","Não, são uns cinco minutos a pé."]]],
["Horário de trabalho","b",[
["What time does my shift start?","Que horas começa o meu turno?"],
["You start at seven in the morning.","Você começa às sete da manhã."],
["Do I need to clock in?","Eu preciso bater o ponto?"],
["Yes, use the machine by the front door.","Sim, use a máquina perto da porta da frente."],
["Your shift ends at three thirty.","Seu turno termina às três e meia."]]],
["No restaurante","b",[
["A table for two, please.","Uma mesa para dois, por favor."],
["Here is the menu. Can I get you something to drink?","Aqui está o cardápio. Posso trazer algo para beber?"],
["I'll have a glass of water.","Vou querer um copo de água."],
["Are you ready to order?","Vocês estão prontos para pedir?"],
["Yes, I'd like the chicken sandwich with fries.","Sim, eu gostaria do sanduíche de frango com batatas fritas."],
["Could we have the check, please?","Pode trazer a conta, por favor?"]]],
["Alugando um quarto","b",[
["Hi, I'm calling about the room for rent.","Oi, estou ligando sobre o quarto para alugar."],
["Is it still available?","Ele ainda está disponível?"],
["Yes. The rent is six hundred dollars a month.","Sim. O aluguel é seiscentos dólares por mês."],
["Are utilities included?","As contas de luz e água estão incluídas?"],
["Water is included, but electricity is not.","A água está incluída, mas a luz não."],
["Can I see the room tomorrow?","Posso ver o quarto amanhã?"]]],
["Abrindo conta no banco","b",[
["I would like to open a checking account.","Eu gostaria de abrir uma conta corrente."],
["Do you have a photo ID?","Você tem um documento com foto?"],
["Yes, here is my passport.","Sim, aqui está meu passaporte."],
["Please fill out this form.","Por favor, preencha este formulário."],
["Your debit card will arrive by mail in a week.","Seu cartão de débito vai chegar pelo correio em uma semana."]]],
["Comprando um chip de celular","b",[
["I need a SIM card for my phone.","Eu preciso de um chip para o meu celular."],
["Do you want a prepaid plan?","Você quer um plano pré-pago?"],
["Yes. How much is the monthly plan?","Sim. Quanto custa o plano mensal?"],
["It's forty dollars with unlimited data.","São quarenta dólares com internet ilimitada."],
["Can you help me set it up?","Você pode me ajudar a configurar?"]]],
["Conversa rápida com colega","b",[
["How was your weekend?","Como foi seu fim de semana?"],
["It was great. I went to the beach.","Foi ótimo. Eu fui à praia."],
["The weather is really hot today.","O tempo está muito quente hoje."],
["Yes, I hope it rains later.","Sim, espero que chova mais tarde."],
["See you at lunch!","Te vejo no almoço!"]]],
["Pedindo ajuda ao supervisor","b",[
["Sorry, I don't understand this task.","Desculpe, eu não entendo esta tarefa."],
["Can you show me how to do it?","Você pode me mostrar como fazer?"],
["Sure. First, check the list.","Claro. Primeiro, confira a lista."],
["Then put the boxes on this shelf.","Depois coloque as caixas nesta prateleira."],

["Hora do almoço","b",[
["When is our lunch break?","Quando é a nossa pausa para o almoço?"],
["We have thirty minutes at noon.","Temos trinta minutos ao meio-dia."],
["Is there a microwave I can use?","Tem um micro-ondas que eu possa usar?"],
["Yes, it's in the kitchen.","Sim, fica na cozinha."],
["Do you want to eat together?","Você quer comer junto?"]]],
["Planos de fim de semana","b",[
["What are you doing this Saturday?","O que você vai fazer neste sábado?"],
["I'm going to a barbecue at my friend's house.","Eu vou a um churrasco na casa de um amigo."],
["Do you want to come with me?","Você quer vir comigo?"],
["I'd love to. What should I bring?","Eu adoraria. O que eu devo levar?"],

// ---------- INTERMEDIÁRIO ----------
["Entrevista de emprego","i",[
["Tell me a little about yourself.","Me fale um pouco sobre você."],
["I have five years of experience in customer service.","Eu tenho cinco anos de experiência em atendimento ao cliente."],

["I like your company's values and I want to grow with the team.","Eu gosto dos valores da sua empresa e quero crescer com a equipe."],

["Yes, my schedule is flexible.","Sim, meu horário é flexível."]]],
["Treinamento de segurança","i",[
["Everyone must wear safety boots on the floor.","Todos devem usar botas de segurança na área de trabalho."],
["Gloves and goggles are in the cabinet.","Luvas e óculos de proteção estão no armário."],
["If you see a spill, report it right away.","Se você vir algo derramado, informe imediatamente."],
["Never lift heavy boxes alone.","Nunca levante caixas pesadas sozinho."],
["The emergency exit is at the back of the building.","A saída de emergência fica nos fundos do prédio."]]],
["Avisando que está doente","i",[
["Hi, this is Carlos. I'm calling in sick today.","Oi, aqui é o Carlos. Estou ligando para avisar que estou doente hoje."],
["I have a fever and a bad headache.","Estou com febre e uma dor de cabeça forte."],
["I'm sorry to hear that. Feel better soon.","Sinto muito. Melhoras."],
["Do I need a doctor's note?","Eu preciso de um atestado médico?"],
["Only if you miss more than two days.","Só se você faltar mais de dois dias."]]],
["Recebendo o pagamento","i",[
["We get paid every other Friday.","Nós recebemos a cada duas sextas-feiras."],
["You can choose direct deposit or a paper check.","Você pode escolher depósito direto ou cheque em papel."],
["I'd prefer direct deposit.","Eu prefiro depósito direto."],
["Please give me your account and routing numbers.","Por favor, me passe o número da sua conta e o código do banco."],
["Your pay stub shows taxes and deductions.","O seu holerite mostra os impostos e descontos."]]],
["Na clínica de urgência","i",[
["I'd like to see a doctor, please.","Eu gostaria de ver um médico, por favor."],
["Do you have health insurance?","Você tem plano de saúde?"],
["No, how much does a visit cost without insurance?","Não, quanto custa uma consulta sem plano?"],
["A basic visit is about one hundred fifty dollars.","Uma consulta básica custa cerca de cento e cinquenta dólares."],
["Please have a seat. The nurse will call your name.","Por favor, sente-se. A enfermeira vai chamar seu nome."]]],
["Na lavanderia","i",[
["How does this washing machine work?","Como funciona esta máquina de lavar?"],
["Put in four quarters and choose the cycle.","Coloque quatro moedas de 25 centavos e escolha o ciclo."],
["Where can I buy detergent?","Onde posso comprar sabão?"],
["There's a vending machine by the door.","Tem uma máquina de venda perto da porta."],
["The dryer takes about forty minutes.","A secadora leva uns quarenta minutos."]]],
["Problema no apartamento","i",[
["Hi, the sink in my kitchen is leaking.","Oi, a pia da minha cozinha está vazando."],
["Also, the heater isn't working.","Além disso, o aquecedor não está funcionando."],
["I'll send someone to fix it tomorrow morning.","Vou mandar alguém consertar amanhã de manhã."],
["Will you be home around nine?","Você vai estar em casa por volta das nove?"],
["No, but you can use the spare key.","Não, mas vocês podem usar a chave reserva."]]],
["Entregando currículo","i",[
["Hello, are you hiring right now?","Olá, vocês estão contratando agora?"],
["Yes, we need people for the night shift.","Sim, precisamos de pessoas para o turno da noite."],
["Here is my resume.","Aqui está meu currículo."],
["Please apply online, too.","Por favor, se candidate pelo site também."],
["The manager will call you this week.","O gerente vai te ligar esta semana."]]],
["Atendendo um cliente","i",[
["Welcome! How can I help you today?","Bem-vindo! Como posso ajudar você hoje?"],
["I'm looking for a size medium in this shirt.","Estou procurando esta camisa no tamanho médio."],
["Let me check in the back for you.","Deixa eu verificar no estoque para você."],
["Sorry, we only have it in large.","Desculpe, só temos no tamanho grande."],

["Trocando de turno","i",[
["Can you cover my shift on Thursday?","Você pode cobrir meu turno na quinta?"],
["I have a doctor's appointment that morning.","Tenho uma consulta médica naquela manhã."],
["Sure, if you take my Sunday shift.","Claro, se você pegar o meu turno de domingo."],

["Na farmácia","i",[

["What's your name and date of birth?","Qual é o seu nome e data de nascimento?"],

["Do you have anything for a sore throat?","Você tem algo para dor de garganta?"],
["Try these lozenges in aisle three.","Experimente estas pastilhas no corredor três."]]],
["Feedback do gerente","i",[
["You're doing a great job so far.","Você está fazendo um ótimo trabalho até agora."],

["Uma consulta médica","t",[
["Last week, I had a bad cough and a fever.","Semana passada, eu estava com uma tosse forte e febre."],

["A mudança","t",[
["Last month, I moved to a bigger apartment.","Mês passado, eu me mudei para um apartamento maior."],
["I rented a small truck for the day.","Eu aluguei um caminhão pequeno por um dia."],

["Ação de Graças","t",[
["Thanksgiving is a very important holiday in the United States.","O Dia de Ação de Graças é um feriado muito importante nos Estados Unidos."],
["It is always on the fourth Thursday of November.","Ele é sempre na quarta quinta-feira de novembro."],
["Families get together and eat a big dinner.","As famílias se reúnem e comem um grande jantar."],
["The main dish is usually roast turkey.","O prato principal geralmente é peru assado."],
["Before eating, people often say what they are thankful for.","Antes de comer, as pessoas costumam dizer pelo que são gratas."],
["This year, my coworker invited me to celebrate with his family.","Este ano, meu colega me convidou para comemorar com a família dele."]]],
["Aprendendo a dirigir aqui","t",[
["Driving in the United States is different from driving in Brazil.","Dirigir nos Estados Unidos é diferente de dirigir no Brasil."],
["The speed limits are in miles per hour, not kilometers.","Os limites de velocidade são em milhas por hora, não em quilômetros."],
["At a four-way stop, the first car to arrive goes first.","Num cruzamento com quatro placas de pare, o primeiro carro que chega passa primeiro."],

["I studied the driver's manual for two weeks before my test.","Eu estudei o manual do motorista por duas semanas antes da prova."]]],
["A entrevista","t",[
["Two weeks ago, I had an interview for a better job.","Há duas semanas, eu tive uma entrevista para um emprego melhor."],
["I practiced my answers in English the night before.","Eu treinei minhas respostas em inglês na noite anterior."],

["I was nervous, but I spoke slowly and clearly.","Eu estava nervoso, mas falei devagar e com clareza."],
["At the end, he asked if I had any questions.","No final, ele perguntou se eu tinha alguma pergunta."],
["Three days later, they called me with an offer.","Três dias depois, eles me ligaram com uma proposta."]]],
["O primeiro salário","t",[
["Today I received my first paycheck at the new job.","Hoje eu recebi meu primeiro pagamento no emprego novo."],
["I was surprised by how much was taken out for taxes.","Fiquei surpreso com quanto foi descontado de impostos."],
["My coworker explained federal tax, state tax, and Social Security.","Meu colega me explicou o imposto federal, o estadual e a Previdência Social."],
["I made a simple budget for the month.","Eu fiz um orçamento simples para o mês."],
["First rent, then bills, then food, and finally savings.","Primeiro o aluguel, depois as contas, depois a comida e, por último, a poupança."],

["O inverno chegou","t",[
["I had never seen snow before I came here.","Eu nunca tinha visto neve antes de vir para cá."],

["Perdido na cidade","t",[
["On my first visit to New York, I got completely lost.","Na minha primeira visita a Nova York, eu me perdi completamente."],
["My phone's battery died, so I couldn't use the map.","A bateria do meu celular acabou, então eu não podia usar o mapa."],

["O jogo de futebol americano","t",[

async function initDb(){
  try{
    if(!(window.claude&&claude.use))return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    docRef=db.collection("data/users/"+uid).doc("progresso");
    const snap=await docRef.get();
    if(snap.exists){const d=snap.data();
      done=Object.assign({},d.done||{},done);pts=Math.max(pts,d.pts||0);pos=Object.assign({},d.pos||{},pos);
      try{const c=JSON.parse(d.custom||"[]");if(c.length>custom.length)custom=c}catch(e){}
      if(!document.getElementById("typ"))home();}
  }catch(e){}
}

let rate=load("ee_rate",1),voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(z=>z.lang==="en-US"&&/natural|google|samantha/i.test(z.name))||v.find(z=>z.lang==="en-US")||v.find(z=>z.lang.startsWith("en"))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
function speak(t,onend){
  if(!("speechSynthesis" in window)){window.open("https://translate.google.com/?sl=en&tl=pt&op=translate&text="+encodeURIComponent(t),"_blank");return}
  stopSpeak();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;if(voice)u.voice=voice;
  if(onend){u.onend=onend;u.onerror=onend}
  speechSynthesis.speak(u);
}

function addPanel(){return `<section class="panel"><h2>Criar lição com seu texto</h2>

async function addCustom(){
  const text=document.getElementById("cText").value.trim();
  const title=document.getElementById("cTitle").value.trim()||"Meu texto";
  const msg=document.getElementById("addMsg"),btn=document.getElementById("addGo");
  if(!text){msg.textContent="Cole um texto primeiro.";return}
  const sents=(text.match(/[^.!?\n]+[.!?]*["')]*/g)||[]).map(s=>s.trim()).filter(Boolean).slice(0,40);
  btn.disabled=true;msg.textContent="Traduzindo...";
  let pts=null;
  try{
    const r=await fetch("/.netlify/functions/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texts:sents})});
    if(!r.ok)throw new Error(r.status);
    pts=(await r.json()).translations;
    if(!Array.isArray(pts))pts=null;
  }catch(e){msg.textContent=navigator.onLine?"Tradução indisponível agora. Tente mais tarde.":"Sem internet. A tradução precisa de conexão."}
  custom.push({title,s:sents.map((s,i)=>[s,pts&&pts[i]?String(pts[i]):"(sem tradução)"])});
  persist();btn.disabled=false;filter="m";home();
}

      if(i>cur)return "";
      const tg=norm(en);let html="",good=0,ok=true;
      for(let k=0;k<tg.length;k++){
        const c=esc(tg[k]);
        if(k<t.length){const m=t[k].toLowerCase()===tg[k].toLowerCase();if(m&&ok)good++;else ok=false;html+=`<span class="${m?"ok":"bad"}">${c}</span>`}
        else html+=`<span class="p">${c}</span>`;
      }
      const w=pt.split(" "),show=Math.ceil(w.length*good/tg.length);
      const ptHtml=w.map((z,j)=>j<show?esc(z):`<span class="h">${esc(z)}</span>`).join(" ");
      return `<div class="sent cur">${who(i)}<div class="en">${html}</div><div class="pt">${ptHtml}</div></div>`;
    }).join("");
    const fin=cur>=x.s.length;
    document.getElementById("typPanel").hidden=fin;
    document.querySelector(".prog").classList.toggle("full",fin);
    if(fin){
      const sib=all().filter(y=>y.lv===x.lv),nx=sib[sib.findIndex(y=>y.id===id)+1];
      const min=Math.max(1,Math.round((Date.now()-t0)/60000));
      box.insertAdjacentHTML("afterend",`<section class="finish" id="finish">
        <h3>Lição concluída! ✓</h3>${canR&&!done[id+"R"]?"<p>Modo Responder liberado!</p>":""}
        <div class="big">${gained?"+"+gained+" pontos":"Revisão feita"}</div>
        <p>${x.s.length} frases · ${min} min · Total: ${pts} pontos</p>
        <div class="row">${nx?'<button class="btn" id="nextL">Próxima lição →</button>':""}${canR?'<button class="btn ghost" id="toR">Modo Responder</button>':""}<button class="btn ghost" id="again">Refazer</button><button class="btn ghost" id="home2">Voltar à lista</button></div>
      </section>`);
      document.getElementById("ptsPill").textContent="★ "+pts+" pts";
      if(nx)document.getElementById("nextL").onclick=()=>lesson(nx.id);
      if(canR)document.getElementById("toR").onclick=()=>lesson(id,"r");
      document.getElementById("finish").scrollIntoView({behavior:"smooth",block:"center"});
    }
    document.getElementById("pg").style.width=(cur/x.s.length*100)+"%";
    lis.hidden=!x.s[cur];
    const a=document.getElementById("again");if(a){a.onclick=()=>lesson(id);document.getElementById("home2").onclick=goHome}
  }
  function next(){cur++;typ.value="";if(cur>=x.s.length){if(!done[id]){gained=10;pts+=10}done[id]=true;pos[id]=0;typ.disabled=true}else pos[id]=cur;persist();render();if(cur<x.s.length)typ.focus()}
  typ.oninput=()=>{if(cur<x.s.length&&norm(typ.value).trim().toLowerCase()===norm(x.s[cur][0]).toLowerCase())next();else render()};
  typ.onkeydown=e=>{if(e.key==="Enter")e.preventDefault()};
  render();typ.focus();window.scrollTo(0,0);
}
function modeBar(id,m){const ok=!!done[id];return `<div class="modes"><button class="chip" data-m="p" aria-pressed="${m==="p"}">Praticar</button><button class="chip" data-m="r" aria-pressed="${m==="r"}" ${ok?"":"disabled"}>${ok?"Responder":"🔒 Responder"}</button>${ok?"":'<span class="hint">Conclua o Praticar para liberar.</span>'}</div>`}
function bindModes(id){app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{if(!b.disabled)lesson(id,b.dataset.m)})}
const strip=s=>norm(s).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
function respond(x,sp){
  stopSpeak();const id=x.id,t0=Date.now();let cur=0,helped=false,gained=0;
  app.innerHTML=`
  <div class="lesson-head"><button class="btn ghost" id="back">← Voltar</button><h2>${esc(x.title)}</h2><span class="pill" id="ptsPill">★ ${pts} pts</span></div>
  <span class="lvl">${LV[x.lv]} · Exit ${x.n} · Responder</span>
  ${modeBar(id,"r")}
  <div class="prog"><i id="pg"></i></div>
  <section class="panel" id="sents"></section>
  <section class="panel" id="typPanel">
    <label for="ans">Sua resposta em inglês</label>
    <textarea id="ans" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row"><button class="btn ghost" id="hint">💡 Dica</button><button class="btn ghost" id="show">👁 Ver resposta</button><button class="btn ghost" id="rep">🔊 Ouvir de novo</button>
    <span class="hint">Pontuação e maiúsculas não contam.</span></div>
    <div class="hint" id="help"></div>
  </section>`;
  if(history.state&&history.state.l)history.replaceState({l:id},"");else history.pushState({l:id},"");
  const goHome=()=>{if(history.state&&history.state.l)history.back();else home()};
  document.getElementById("back").onclick=goHome;bindModes(id);
  const box=document.getElementById("sents"),ans=document.getElementById("ans"),help=document.getElementById("help");
  const who=i=>`<span class="who${sp[1][i]==="Y"?" you":""}">${sp[1][i]==="Y"?"Você":esc(sp[0])}</span>`;
  const lastO=()=>{for(let k=cur-1;k>=0;k--)if(sp[1][k]==="O")return x.s[k][0];return ""};
  box.onclick=e=>{const b=e.target.closest(".say");if(b)speak(x.s[+b.dataset.i][0])};
  document.getElementById("rep").onclick=()=>{const t=lastO();if(t)speak(t)};
  document.getElementById("hint").onclick=()=>{if(cur<x.s.length){helped=true;help.textContent="Dica: "+x.s[cur][0].split(" ").map(w=>w[0]+"_".repeat(Math.max(0,w.replace(/[^A-Za-z']/g,"").length-1))).join(" ")}};
  document.getElementById("show").onclick=()=>{if(cur<x.s.length){helped=true;help.textContent="Resposta: "+x.s[cur][0]}};
  function advance(){
    let spoke=[];
    while(cur<x.s.length&&sp[1][cur]==="O"){spoke.push(x.s[cur][0]);cur++}
    if(spoke.length){const go=k=>{if(k<spoke.length)speak(spoke[k],()=>go(k+1))};go(0)}
    render();
  }
  function render(){
    help.textContent="";ans.value="";ans.className="";
    box.innerHTML=x.s.map(([en,pt],i)=>{
      if(i<cur)return `<div class="sent">${who(i)}<div class="en donee">${esc(en)}<button class="say" data-i="${i}" aria-label="Ouvir">🔊</button></div><div class="pt">${esc(pt)}</div></div>`;
      if(i===cur)return `<div class="sent cur">${who(i)}<div class="ask">Diga em inglês: “${esc(pt)}”</div></div>`;
      return "";
    }).join("");
    const fin=cur>=x.s.length;
    document.getElementById("typPanel").hidden=fin;
    document.querySelector(".prog").classList.toggle("full",fin);
    document.getElementById("pg").style.width=(cur/x.s.length*100)+"%";
    if(fin){
      if(!done[id+"R"]){gained=helped?10:20;pts+=gained}done[id+"R"]=true;persist();
      const sib=all().filter(y=>y.lv===x.lv),nx=sib[sib.findIndex(y=>y.id===id)+1];
      const min=Math.max(1,Math.round((Date.now()-t0)/60000));
      box.insertAdjacentHTML("afterend",`<section class="finish" id="finish">
        <h3>Conversa concluída! ✓</h3>
        <div class="big">${gained?"+"+gained+" pontos":"Revisão feita"}</div>
        <p>${helped?"Com ajuda":"Sem ajuda"} · ${min} min · Total: ${pts} pontos</p>
        <div class="row">${nx?'<button class="btn" id="nextL">Próxima lição →</button>':""}<button class="btn ghost" id="again">Refazer</button><button class="btn ghost" id="home2">Voltar à lista</button></div>
      </section>`);
      document.getElementById("ptsPill").textContent="★ "+pts+" pts";
      if(nx)document.getElementById("nextL").onclick=()=>lesson(nx.id);
      document.getElementById("again").onclick=()=>lesson(id,"r");
      document.getElementById("home2").onclick=goHome;
      document.getElementById("finish").scrollIntoView({behavior:"smooth",block:"center"});
    }else ans.focus();
  }
  ans.oninput=()=>{
    const a=strip(ans.value),t=strip(x.s[cur][0]);
    if(a===t){cur++;advance();return}
    ans.className=!a?"":t.startsWith(a)?"okk":"bad";
  };
  ans.onkeydown=e=>{if(e.key==="Enter")e.preventDefault()};
  advance();window.scrollTo(0,0);
}
if(history.state&&history.state.l)history.replaceState(null,"");
window.addEventListener("popstate",()=>home());
home();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body></html>
