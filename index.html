<style>
/* Layout: lista de "saídas" estilo placa de rodovia americana -> tela de digitação com tradução revelada abaixo */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#13201B; --muted:#5E6E67; --line:#D7DFDB;
  --sign:#0B6B47; --sign-ink:#FFFFFF; --ok:#137A3E; --bad:#C2352B; --pend:#9AA8A2; --pt:#2C4A9A;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211D; --ink:#E7EEEA; --muted:#93A39C; --line:#2A3832;
  --sign:#14875C; --sign-ink:#FFFFFF; --ok:#4CC27E; --bad:#FF7A6E; --pend:#5E6E67; --pt:#9DB5FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211D; --ink:#E7EEEA; --muted:#93A39C; --line:#2A3832;
  --sign:#14875C; --sign-ink:#FFFFFF; --ok:#4CC27E; --bad:#FF7A6E; --pend:#5E6E67; --pt:#9DB5FF; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1{font:800 clamp(28px,7vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--sign)}
.sub{color:var(--muted);margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:700 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat{margin-left:auto;font:600 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.exit{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--sign);color:var(--sign-ink);border:2px solid var(--sign);outline:2px solid var(--sign-ink);outline-offset:-6px;border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit}
.exit:focus-visible{box-shadow:0 0 0 3px var(--ink)}
.exit .num{font:700 12px/1.1 var(--mono);text-transform:uppercase;letter-spacing:.08em;border:1.5px solid currentColor;border-radius:4px;padding:6px 7px;text-align:center;min-width:58px}
.exit .num b{display:block;font:800 20px var(--display);letter-spacing:0}
.exit .t{min-width:0;flex:1}
.exit .t strong{display:block;font:700 17px/1.25 var(--display)}
.exit .t small{opacity:.85;font-size:13px}
.exit .done{font:700 12px var(--mono);background:var(--sign-ink);color:var(--sign);border-radius:4px;padding:3px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.panel h2{font:700 18px var(--display);margin:0}
label{font:700 13px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
textarea,input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;font:17px/1.5 var(--mono)}
textarea:focus,input:focus{outline:none;border-color:var(--sign)}
.btn{background:var(--sign);color:var(--sign-ink);border:none;border-radius:8px;padding:10px 16px;font:700 15px var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:14px;color:var(--muted)}
.lesson-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lesson-head h2{font:800 24px/1.15 var(--display);margin:0;flex:1;min-width:0;text-wrap:balance}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sign);width:0;transition:width .25s}
.sent{display:grid;gap:4px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sent:last-child{border-bottom:none}
.en{font:17px/1.6 var(--mono);word-break:break-word}
.en .ok{color:var(--ok)} .en .bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent);border-radius:2px} .en .p{color:var(--pend)}
.en.donee{color:var(--ink)}
.pt{color:var(--pt);font-size:16px;min-height:1.5em}
.pt .h{color:transparent;background:var(--line);border-radius:3px}
.cur{background:color-mix(in srgb,var(--sign) 7%,transparent);border-radius:8px;padding:10px;border-bottom:none}
.hint{font-size:13px;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.say{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:2px 8px;font-size:14px;cursor:pointer;margin-left:6px;vertical-align:middle}
.lvl{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.who{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.who.you{color:var(--sign)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .chip:disabled{opacity:.5;cursor:default}
.ask{font:600 15px var(--body);color:var(--pt);background:color-mix(in srgb,var(--pt) 8%,transparent);border-radius:6px;padding:6px 10px}
#ans.okk{border-color:var(--ok)} #ans.bad{border-color:var(--bad)}
.w{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted var(--muted)}
.w:focus-visible{outline:2px solid var(--sign)}
.tip{position:fixed;z-index:20;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font:600 15px var(--body);max-width:70vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.resume{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--sign);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit}
.resume b{font:700 16px var(--display);display:block}
.resume small{color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px;display:grid;gap:10px}
.modal h2{font:800 22px var(--display);margin:0}
.modal h3{font:700 16px var(--display);margin:6px 0 0}
.modal p,.modal li{margin:0;line-height:1.5}
.modal ul{margin:0;padding-left:20px;display:grid;gap:4px}
.auth{max-width:420px;margin:0 auto;display:grid;gap:14px;width:100%}
.auth .panel{gap:10px}
.tabs{display:flex;gap:6px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.price{font:800 40px var(--display);color:var(--sign);line-height:1}
.tag{display:inline-block;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--sign) 14%,transparent);color:var(--sign);border-radius:4px;padding:4px 8px}
.pix{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 15px var(--mono);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;word-break:break-all}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.adm{display:grid;gap:8px}
.arow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.arow .who2{flex:1;min-width:180px}
.arow .who2 b{display:block}
.arow small{color:var(--muted);word-break:break-all}
.st{font:700 12px var(--mono);border-radius:4px;padding:3px 7px;white-space:nowrap}
.st.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st.wait{background:color-mix(in srgb,var(--pt) 15%,transparent);color:var(--pt)}
.st.off{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill{font:700 13px var(--mono);background:var(--sign);color:var(--sign-ink);border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.finish{background:var(--sign);color:var(--sign-ink);outline:2px solid var(--sign-ink);outline-offset:-7px;border-radius:12px;padding:22px 18px;display:grid;gap:10px;text-align:center;animation:pop .45s ease-out}
.finish h3{font:800 26px/1.1 var(--display);margin:0}
.finish .big{font:800 34px var(--display)}
.finish p{margin:0;opacity:.9}
.finish .row{justify-content:center}
.finish .btn{background:var(--sign-ink);color:var(--sign)}
.finish .btn.ghost{background:transparent;color:var(--sign-ink);border-color:var(--sign-ink)}
.prog.full i{background:var(--ok);animation:flash .5s 3}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
@keyframes flash{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.finish,.prog.full i{animation:none}}
</style>

<div class="wrap" id="app"></div>

<script>
let L=[];
// ---------- acesso (Supabase) ----------
const SB="https://thotxnszjiiipqhpetba.supabase.co",SBK="sb_publishable_ruFNKM-AmNyES-aC2lg9yQ_16_IjalD";
const PIX="leniel.ireno@gmail.com",PRECO="R$ 9,99",DIAS=45,LIM_TX=5;
let sess=null,isAdmin=false,expira=null;
try{sess=JSON.parse(localStorage.getItem("ee_sess")||"null")}catch(e){}
function setSess(d){sess={at:d.access_token,rt:d.refresh_token,exp:Date.now()+((d.expires_in||3600)-60)*1000,email:(d.user&&d.user.email)||(sess&&sess.email),nome:(d.user&&d.user.user_metadata&&d.user.user_metadata.nome)||(sess&&sess.nome)||""};try{localStorage.setItem("ee_sess",JSON.stringify(sess))}catch(e){}}
function logout(){sess=null;try{localStorage.removeItem("ee_sess");localStorage.removeItem("ee_lic")}catch(e){}loginScreen()}
async function sbAuth(path,body){
  const r=await fetch(SB+"/auth/v1/"+path,{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=(d.msg||d.error_description||d.message||"")+"";
    if(/invalid login/i.test(m))throw new Error("E-mail ou senha incorretos.");
    if(/already registered|already exists/i.test(m))throw new Error("Este e-mail já tem conta. Use Entrar.");
    if(/password/i.test(m))throw new Error("A senha precisa ter pelo menos 6 caracteres.");
    if(/email/i.test(m))throw new Error("E-mail inválido.");
    throw new Error(m||"Erro "+r.status)}
  return d;
}
async function token(){
  if(!sess)return null;
  if(Date.now()>sess.exp&&navigator.onLine){try{setSess(await sbAuth("token?grant_type=refresh_token",{refresh_token:sess.rt}))}catch(e){}}
  return sess&&sess.at;
}
async function authFetch(url,opt={}){const t=await token();return fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}})}
const fmtD=d=>new Date(d).toLocaleDateString("pt-BR");
async function boot(){
  if(!sess)return loginScreen();
  app.innerHTML='<p class="msg">Carregando suas lições...</p>';
  let r=null;try{r=await authFetch("/.netlify/functions/licoes")}catch(e){}
  if(r&&r.ok){const d=await r.json();L=d.L;SPK=d.SPK;isAdmin=d.admin;expira=d.expira_em;save("ee_lic",{L,SPK,admin:isAdmin,expira});return home()}
  if(r&&r.status===401){return logout()}
  if(r&&r.status===402){const d=await r.json().catch(()=>({}));try{localStorage.removeItem("ee_lic")}catch(e){}return payScreen(d.expira_em)}
  const c=load("ee_lic",null);
  if(c&&(c.admin||(c.expira&&new Date(c.expira)>new Date()))){L=c.L;SPK=c.SPK;isAdmin=c.admin;expira=c.expira;return home()}
  app.innerHTML=`<div class="auth"><header><h1>Exit <span>English</span></h1></header><section class="panel"><h2>Sem conexão</h2><p class="msg">Conecte-se à internet para carregar as lições pela primeira vez.</p><button class="btn" id="retry">Tentar de novo</button></section></div>`;
  document.getElementById("retry").onclick=boot;
}
function loginScreen(){
  let mode="in";
  const draw=()=>{
    app.innerHTML=`<div class="auth">
    <header><h1>Exit <span>English</span></h1><p class="sub">A forma mais fácil de treinar seu inglês cotidiano.</p></header>
    <section class="panel">
      <div class="tabs"><button class="chip" data-t="in" aria-pressed="${mode==="in"}">Entrar</button><button class="chip" data-t="up" aria-pressed="${mode==="up"}">Criar conta</button></div>
      <form id="af" class="adm">
        ${mode==="up"?'<label for="aNome">Seu nome</label><input id="aNome" autocomplete="name" required>':""}
        <label for="aEmail">E-mail</label><input id="aEmail" type="email" autocomplete="email" required>
        <label for="aPass">Senha</label><input id="aPass" type="password" autocomplete="${mode==="up"?"new-password":"current-password"}" minlength="6" required>
        <div class="err" id="aErr"></div>
        <button class="btn" id="aGo" type="submit">${mode==="up"?"Criar conta":"Entrar"}</button>
      </form>
      <p class="hint">${mode==="up"?"Depois de criar a conta, aparece como liberar seu acesso.":"Esqueceu a senha? Fale com o administrador na comunidade."}</p>
    </section></div>`;
    app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{mode=b.dataset.t;draw()});
    document.getElementById("af").onsubmit=async e=>{
      e.preventDefault();const err=document.getElementById("aErr"),go=document.getElementById("aGo");
      const email=document.getElementById("aEmail").value.trim(),password=document.getElementById("aPass").value;
      go.disabled=true;err.textContent="";
      try{
        if(mode==="up"){
          const nome=document.getElementById("aNome").value.trim();
          const d=await sbAuth("signup",{email,password,data:{nome}});
          if(d.access_token)setSess(d);else setSess(await sbAuth("token?grant_type=password",{email,password}));
        }else setSess(await sbAuth("token?grant_type=password",{email,password}));
        boot();
      }catch(x){err.textContent=navigator.onLine?x.message:"Sem internet.";go.disabled=false}
    };
  };draw();
}
function payScreen(exp){
  const venc=exp&&new Date(exp)<new Date();
  app.innerHTML=`<div class="auth">
  <header class="top"><div><h1>Exit <span>English</span></h1><p class="sub">Olá${sess&&sess.nome?", "+esc(sess.nome):""}!</p></div><button class="btn ghost" id="out">Sair</button></header>
  <section class="panel">
    <h2>${venc?"Seu acesso venceu em "+fmtD(exp):"Libere seu acesso"}</h2>
    <span class="tag">Valor simbólico para os primeiros 300 alunos</span>
    <div class="price">${PRECO}</div>
    <p class="msg">Acesso a todas as lições por ${DIAS} dias.</p>
    <label>Chave Pix (e-mail)</label>
    <div class="pix"><span id="pixK">${PIX}</span><button class="btn ghost" id="copy" type="button">Copiar</button></div>
    <ol class="steps">
      <li>Pague ${PRECO} pelo Pix usando a chave acima.</li>
      <li>Envie o comprovante no WhatsApp da comunidade junto com o e-mail da sua conta: <b>${esc(sess?sess.email:"")}</b></li>
      <li>Assim que o acesso for liberado, toque em "Verificar acesso".</li>
    </ol>
    <button class="btn" id="chk">Verificar acesso</button>
  </section></div>`;
  document.getElementById("out").onclick=logout;
  document.getElementById("chk").onclick=boot;
  document.getElementById("copy").onclick=e=>{const b=e.target;navigator.clipboard.writeText(PIX).then(()=>b.textContent="Copiado!").catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("pixK"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selecionado"})};
}
async function adminScreen(){
  history.pushState({l:"admin"},"");
  app.innerHTML=`<div class="lesson-head"><button class="btn ghost" id="back">← Voltar</button><h2>Alunos</h2></div>
  <input id="aq" placeholder="Buscar por nome ou e-mail">
  <p class="msg" id="acount">Carregando...</p><div class="adm" id="alist"></div>`;
  document.getElementById("back").onclick=()=>history.back();
  let rows=[];
  const h=async()=>({apikey:SBK,Authorization:"Bearer "+await token(),"Content-Type":"application/json"});
  const status=a=>!a.expira_em?["wait","Aguardando"]:new Date(a.expira_em)>new Date()?["on","Ativo até "+fmtD(a.expira_em)]:["off","Venceu "+fmtD(a.expira_em)];
  const draw=()=>{
    const q=document.getElementById("aq").value.toLowerCase();
    const ativos=rows.filter(a=>a.expira_em&&new Date(a.expira_em)>new Date()).length;
    document.getElementById("acount").textContent=`${rows.length} cadastrados · ${ativos} ativos · ${rows.filter(a=>!a.expira_em).length} aguardando`;
    document.getElementById("alist").innerHTML=rows.filter(a=>!q||(a.nome||"").toLowerCase().includes(q)||a.email.toLowerCase().includes(q)).map(a=>{const[c,t]=status(a);return `<div class="arow"><div class="who2"><b>${esc(a.nome||"(sem nome)")}</b><small>${esc(a.email)} · desde ${fmtD(a.criado_em)}</small></div><span class="st ${c}">${t}</span><button class="btn" data-lib="${a.id}">+${DIAS} dias</button>${c==="on"?`<button class="btn ghost" data-blk="${a.id}">Bloquear</button>`:""}</div>`}).join("")||'<p class="msg">Nenhum aluno encontrado.</p>';
  };
  const setExp=async(id,val)=>{
    const r=await fetch(SB+"/rest/v1/alunos?id=eq."+id,{method:"PATCH",headers:{...await h(),Prefer:"return=representation"},body:JSON.stringify({expira_em:val})});
    if(!r.ok){alertMsg("Não foi possível salvar. Tente de novo.");return}
    const [u]=await r.json();rows=rows.map(a=>a.id===id?u:a);draw();
  };
  const alertMsg=t=>{document.getElementById("acount").textContent=t};
  document.getElementById("aq").oninput=draw;
  document.getElementById("alist").onclick=e=>{
    const l=e.target.closest("[data-lib]"),b=e.target.closest("[data-blk]");
    if(l){const a=rows.find(x=>x.id===l.dataset.lib);const base=a.expira_em&&new Date(a.expira_em)>new Date()?new Date(a.expira_em):new Date();base.setDate(base.getDate()+DIAS);l.disabled=true;setExp(a.id,base.toISOString())}
    if(b){b.disabled=true;setExp(b.dataset.blk,new Date().toISOString())}
  };
  try{const r=await fetch(SB+"/rest/v1/alunos?select=*&order=criado_em.desc",{headers:await h()});if(!r.ok)throw 0;rows=await r.json();draw()}
  catch(e){console.error("admin",e);alertMsg("Não foi possível carregar os alunos. Verifique a internet.")}
}
let SPK={};
const LV={b:"Básico",i:"Intermediário",a:"Avançado",v:"Vocabulário",t:"Textos"};

// ---------- estado local ----------
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let pts=load("ee_pts",0);
let done=load("ee_done",{});           // {id:true}
let pos=load("ee_pos",{});             // {id:frase atual}
let custom=load("ee_custom",[]);       // [{title,s:[[en,pt],...]}]
let docRef=null,saveT=null;
function persist(){
  save("ee_done",done);save("ee_pts",pts);save("ee_pos",pos);save("ee_custom",custom);
  clearTimeout(saveT);saveT=setTimeout(()=>{if(docRef)docRef.set({done,pos,pts,custom:JSON.stringify(custom)}).catch(()=>{})},800);
}
async function initDb(){
  try{
    if(!(window.claude&&claude.use))return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    docRef=db.collection("data/users/"+uid).doc("progresso");
    const snap=await docRef.get();
    if(snap.exists){const d=snap.data();
      done=Object.assign({},d.done||{},done);pts=Math.max(pts,d.pts||0);pos=Object.assign({},d.pos||{},pos);
      try{const c=JSON.parse(d.custom||"[]");if(c.length>custom.length)custom=c}catch(e){}
      if(!document.getElementById("typ"))home();}
  }catch(e){}
}
let filter="all";
const app=document.getElementById("app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g," ");


function all(){return L.map((l,i)=>({id:"L"+i,n:i+1,title:l[0],lv:l[1],s:l[2]}))
  .concat(custom.map((c,i)=>({id:"C"+i,n:"M"+(i+1),title:c.title,lv:"m",s:c.s})))}

// ---------- lista ----------
let rate=load("ee_rate",1),voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(z=>z.lang==="en-US"&&/natural|google|samantha/i.test(z.name))||v.find(z=>z.lang==="en-US")||v.find(z=>z.lang.startsWith("en"))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
function speak(t,onend){
  if(!("speechSynthesis" in window)){window.open("https://translate.google.com/?sl=en&tl=pt&op=translate&text="+encodeURIComponent(t),"_blank");return}
  stopSpeak();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;if(voice)u.voice=voice;
  if(onend){u.onend=onend;u.onerror=onend}
  speechSynthesis.speak(u);
}
function home(){stopSpeak();
  const items=all().filter(x=>filter==="all"||x.lv===filter);
  const total=L.length,ok=L.filter((_,i)=>done["L"+i]).length;
  app.innerHTML=`
  <header class="top"><div><h1>Exit <span>English</span></h1><p class="sub">A forma mais fácil de treinar seu inglês cotidiano.</p></div><div class="hbtns">${isAdmin?'<button class="btn" id="admin">Alunos</button>':""}<button class="btn ghost" id="info" style="white-space:nowrap">ℹ Ajuda</button><button class="btn ghost" id="out">Sair</button></div></header>
  ${!isAdmin&&expira?`<p class="hint">Acesso liberado até ${fmtD(expira)}</p>`:""}
  ${resumeBtn()}
  <div class="bar">${[["all","Todas"],["b","Básico"],["i","Intermediário"],["a","Avançado"],["v","Vocabulário"],["t","Textos"],["m","Meus textos"]].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${t}</button>`).join("")}
  <span class="stat">${ok}/${total} concluídas</span><span class="pill">★ ${pts} pts</span></div>
  ${filter==="m"||filter==="all"?addPanel():""}
  <div class="list">${items.map(x=>`
    <button class="exit" data-id="${x.id}">
      <span class="num">Exit<b>${x.n}</b></span>
      <span class="t"><strong>${esc(x.title)}</strong><small>${x.lv==="m"?"Meu texto":LV[x.lv]} · ${x.s.length} frases${pos[x.id]?` · parou na frase ${pos[x.id]+1}`:""}</small></span>
      ${done[x.id+"R"]?'<span class="done">FEITA ★</span>':done[x.id]?'<span class="done">FEITA</span>':""}
    </button>`).join("")||'<p class="msg">Nenhum texto ainda. Cole um texto acima para criar sua lição.</p>'}</div>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;home()});
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>lesson(b.dataset.id));
  document.getElementById("info").onclick=showInfo;
  document.getElementById("out").onclick=logout;
  if(isAdmin)document.getElementById("admin").onclick=adminScreen;
  const rb=document.getElementById("resume");if(rb)rb.onclick=()=>{const l=load("ee_last",null);if(l)lesson(l.id,l.m)};
  const go=document.getElementById("addGo");
  if(go)go.onclick=addCustom;
}
function addPanel(){return `<section class="panel"><h2>Criar lição com seu texto</h2>
  <label for="cTitle">Título</label><input id="cTitle" placeholder="Ex.: E-mail do meu chefe">
  <label for="cText">Texto em inglês</label><textarea id="cText" rows="4" placeholder="Cole aqui um texto em inglês..."></textarea>
  <div class="row"><button class="btn" id="addGo">Traduzir e criar lição</button><span class="msg" id="addMsg">A tradução é feita automaticamente.</span></div></section>`}

async function addCustom(){
  const text=document.getElementById("cText").value.trim();
  const title=document.getElementById("cTitle").value.trim()||"Meu texto";
  const msg=document.getElementById("addMsg"),btn=document.getElementById("addGo");
  if(!text){msg.textContent="Cole um texto primeiro.";return}
  const hoje=new Date().toDateString();let tx=load("ee_tx",{d:"",n:0});if(tx.d!==hoje)tx={d:hoje,n:0};
  if(!isAdmin&&tx.n>=LIM_TX){msg.textContent=`Limite de ${LIM_TX} textos por dia atingido. Volte amanhã.`;return}
  tx.n++;save("ee_tx",tx);
  const sents=(text.match(/[^.!?\n]+[.!?]*["')]*/g)||[]).map(s=>s.trim()).filter(Boolean).slice(0,40);
  btn.disabled=true;msg.textContent="Traduzindo...";
  let pts=null;
  try{
    const r=await authFetch("/.netlify/functions/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texts:sents})});
    if(!r.ok)throw new Error(r.status);
    pts=(await r.json()).translations;
    if(!Array.isArray(pts))pts=null;
  }catch(e){msg.textContent=navigator.onLine?"Tradução indisponível agora. Tente mais tarde.":"Sem internet. A tradução precisa de conexão."}
  custom.push({title,s:sents.map((s,i)=>[s,pts&&pts[i]?String(pts[i]):"(sem tradução)"])});
  persist();btn.disabled=false;filter="m";home();
}

// ---------- lição ----------
function lesson(id,mode){
  const x=all().find(y=>y.id===id);if(!x)return home();
  save("ee_last",{id,m:mode==="r"?"r":"p"});
  const sp=x.id[0]==="L"?SPK[x.id.slice(1)]:null;
  const canR=!!(sp&&sp[1].includes("Y")&&sp[1].includes("O"));
  if(mode==="r"&&canR&&done[id])return respond(x,sp);let cur=Math.min(pos[id]||0,x.s.length);if(cur>=x.s.length)cur=0;const t0=Date.now();let gained=0;
  app.innerHTML=`
  <div class="lesson-head"><button class="btn ghost" id="back">← Voltar</button><h2>${esc(x.title)}</h2><span class="pill" id="ptsPill">★ ${pts} pts</span></div>
  <span class="lvl">${x.lv==="m"?"Meu texto":LV[x.lv]} · Exit ${x.n}</span>
  ${canR?modeBar(id,"p"):""}
  <div class="prog"><i id="pg"></i></div>
  <section class="panel" id="sents"></section>
  <section class="panel" id="typPanel">
    <label for="typ">Digite a frase destacada</label>
    <textarea id="typ" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row"><button class="btn ghost" id="listen">🔊 Ouvir frase</button><button class="btn ghost" id="listenAll">▶ Ouvir lição</button><button class="btn ghost" id="spd"></button><button class="btn ghost" id="skip">Pular frase</button>
    <span class="hint">Maiúsculas não contam. Verde = certo, vermelho = errado.</span></div>
  </section>`;
  const box=document.getElementById("sents"),typ=document.getElementById("typ");
  if(history.state&&history.state.l)history.replaceState({l:id},"");else history.pushState({l:id},"");
  const goHome=()=>{if(history.state&&history.state.l)history.back();else home()};
  document.getElementById("back").onclick=goHome;bindModes(id);
  const who=i=>sp?`<span class="who${sp[1][i]==="Y"?" you":""}">${sp[1][i]==="Y"?"Você":esc(sp[0])}</span>`:"";
  document.getElementById("skip").onclick=()=>next();
  const lis=document.getElementById("listen"),la=document.getElementById("listenAll"),spd=document.getElementById("spd");
  let playingAll=false;
  const setSpd=()=>spd.textContent="Velocidade: "+(rate<1?"devagar":"normal");setSpd();
  spd.onclick=()=>{rate=rate<1?1:.7;save("ee_rate",rate);setSpd()};
  lis.onclick=()=>{if(x.s[cur])speak(x.s[cur][0])};
  la.onclick=()=>{
    if(playingAll){stopSpeak();playingAll=false;la.textContent="▶ Ouvir lição";return}
    playingAll=true;la.textContent="■ Parar";let k=0;
    const go=()=>{if(!playingAll||k>=x.s.length){playingAll=false;la.textContent="▶ Ouvir lição";return}speak(x.s[k++][0],go)};go();
  };
  box.onclick=e=>{if(wordTap(e))return;const b=e.target.closest(".say");if(b)speak(x.s[+b.dataset.i][0])};
  function render(){
    const t=norm(typ.value);
    box.innerHTML=x.s.map(([en,pt],i)=>{
      if(i<cur)return `<div class="sent">${who(i)}<div class="en donee">${words(en)}<button class="say" data-i="${i}" aria-label="Ouvir">🔊</button></div><div class="pt">${esc(pt)}</div></div>`;
      if(i>cur)return "";
      const tg=norm(en);let html="",good=0,ok=true;
      for(let k=0;k<tg.length;k++){
        const c=esc(tg[k]);
        if(k<t.length){const m=t[k].toLowerCase()===tg[k].toLowerCase();if(m&&ok)good++;else ok=false;html+=`<span class="${m?"ok":"bad"}">${c}</span>`}
        else html+=`<span class="p">${c}</span>`;
      }
      const w=pt.split(" "),show=Math.ceil(w.length*good/tg.length);
      const ptHtml=w.map((z,j)=>j<show?esc(z):`<span class="h">${esc(z)}</span>`).join(" ");
      return `<div class="sent cur">${who(i)}<div class="en">${html}</div><div class="pt">${ptHtml}</div></div>`;
    }).join("");
    const fin=cur>=x.s.length;
    document.getElementById("typPanel").hidden=fin;
    document.querySelector(".prog").classList.toggle("full",fin);
    if(fin){
      const sib=all().filter(y=>y.lv===x.lv),nx=sib[sib.findIndex(y=>y.id===id)+1];
      const min=Math.max(1,Math.round((Date.now()-t0)/60000));
      box.insertAdjacentHTML("afterend",`<section class="finish" id="finish">
        <h3>Lição concluída! ✓</h3>${canR&&!done[id+"R"]?"<p>Modo Responder liberado!</p>":""}
        <div class="big">${gained?"+"+gained+" pontos":"Revisão feita"}</div>
        <p>${x.s.length} frases · ${min} min · Total: ${pts} pontos</p>
        <div class="row">${nx?'<button class="btn" id="nextL">Próxima lição →</button>':""}${canR?'<button class="btn ghost" id="toR">Modo Responder</button>':""}<button class="btn ghost" id="again">Refazer</button><button class="btn ghost" id="home2">Voltar à lista</button></div>
      </section>`);
      document.getElementById("ptsPill").textContent="★ "+pts+" pts";
      if(nx)document.getElementById("nextL").onclick=()=>lesson(nx.id);
      if(canR)document.getElementById("toR").onclick=()=>lesson(id,"r");
      document.getElementById("finish").scrollIntoView({behavior:"smooth",block:"center"});
    }
    document.getElementById("pg").style.width=(cur/x.s.length*100)+"%";
    lis.hidden=!x.s[cur];
    const a=document.getElementById("again");if(a){a.onclick=()=>lesson(id);document.getElementById("home2").onclick=goHome}
  }
  function next(){cur++;typ.value="";if(cur>=x.s.length){if(!done[id]){gained=10;pts+=10}done[id]=true;pos[id]=0;typ.disabled=true}else pos[id]=cur;persist();render();if(cur<x.s.length)typ.focus()}
  typ.oninput=()=>{if(cur<x.s.length&&norm(typ.value).trim().toLowerCase()===norm(x.s[cur][0]).toLowerCase())next();else render()};
  typ.onkeydown=e=>{if(e.key==="Enter")e.preventDefault()};
  render();typ.focus();window.scrollTo(0,0);
}
function words(en){return en.split(/(\s+)/).map(t=>{const w=t.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,"");if(!w)return esc(t);const i=t.indexOf(w);return esc(t.slice(0,i))+`<button class="w" data-w="${esc(w)}">${esc(w)}</button>`+esc(t.slice(i+w.length))}).join("")}
let wcache=load("ee_wcache",{}),tipEl=null;
function closeTip(){if(tipEl){tipEl.remove();tipEl=null}}
document.addEventListener("click",e=>{if(tipEl&&!e.target.closest(".w"))closeTip()});
function wordTap(e){
  const b=e.target.closest(".w");if(!b)return false;
  const w=b.dataset.w,k=w.toLowerCase();speak(w);closeTip();
  tipEl=document.createElement("div");tipEl.className="tip";document.body.appendChild(tipEl);
  const r=b.getBoundingClientRect();
  const place=()=>{if(!tipEl)return;const tw=tipEl.offsetWidth;tipEl.style.left=Math.max(8,Math.min(innerWidth-tw-8,r.left+r.width/2-tw/2))+"px";tipEl.style.top=(r.top>60?r.top-tipEl.offsetHeight-6:r.bottom+6)+"px"};
  const show=t=>{if(tipEl){tipEl.textContent=w+" → "+t;place()}};
  if(wcache[k]){show(wcache[k]);return true}
  show("…");
  authFetch("/.netlify/functions/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texts:[w]})})
    .then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{const t=d.translations[0];wcache[k]=t;save("ee_wcache",wcache);show(t)})
    .catch(()=>show(navigator.onLine?"tradução indisponível":"sem internet"));
  return true;
}
function resumeBtn(){
  const l=load("ee_last",null);if(!l)return "";
  const x=all().find(y=>y.id===l.id);if(!x)return "";
  const p=l.m==="r"?"modo Responder":pos[x.id]?`frase ${pos[x.id]+1} de ${x.s.length}`:"início";
  return `<button class="resume" id="resume"><span style="font-size:22px">▶</span><span><b>Voltar aonde parou</b><small>Exit ${x.n} · ${esc(x.title)} · ${p}</small></span></button>`;
}
function showInfo(){
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<div class="modal" role="dialog" aria-label="Como usar">
  <h2>Como usar o Exit English</h2>
  <h3>1. Escolha uma lição</h3>
  <p>Use os filtros para escolher o nível: Básico, Intermediário, Avançado, Vocabulário ou Textos.</p>
  <h3>2. Praticar</h3>
  <ul><li>Digite a frase destacada. Letra certa fica verde, errada fica vermelha.</li>
  <li>A tradução aparece enquanto você digita. Ao acertar a frase, o app passa para a próxima.</li>
  <li>Maiúsculas não contam.</li></ul>
  <h3>3. Ouvir</h3>
  <ul><li>🔊 Ouvir frase: fala a frase atual.</li>
  <li>🔊 ao lado de uma frase pronta: ouve aquela frase de novo.</li>
  <li>▶ Ouvir lição: lê a lição inteira. Velocidade: normal ou devagar.</li>
  <li>Toque numa palavra de uma frase pronta para ouvir e ver a tradução dela.</li></ul>
  <h3>4. Responder</h3>
  <p>Nos diálogos, depois de concluir o Praticar, libera o modo Responder. O personagem fala e você responde de memória. Use 💡 Dica ou 👁 Ver resposta se travar.</p>
  <h3>5. Pontos</h3>
  <ul><li>Praticar: 10 pontos por lição.</li><li>Responder sem ajuda: 20 pontos. Com ajuda: 10.</li><li>Refazer não soma pontos de novo.</li></ul>
  <h3>6. Meus textos</h3>
  <p>Cole qualquer texto em inglês e o app traduz e cria uma lição para você. Precisa de internet.</p>
  <h3>7. Voltar aonde parou</h3>
  <p>O botão no topo abre a última lição em que você estava, na frase em que parou.</p>
  <h3>8. Conta e acesso</h3>
  <p>Seu acesso vale ${DIAS} dias a partir da liberação. "Meus textos" permite até ${LIM_TX} traduções por dia. Esqueceu a senha? Fale com o administrador na comunidade.</p>
  <button class="btn" id="closeInfo">Entendi</button></div>`;
  document.body.appendChild(o);
  o.onclick=e=>{if(e.target===o||e.target.id==="closeInfo")o.remove()};
}
function modeBar(id,m){const ok=!!done[id];return `<div class="modes"><button class="chip" data-m="p" aria-pressed="${m==="p"}">Praticar</button><button class="chip" data-m="r" aria-pressed="${m==="r"}" ${ok?"":"disabled"}>${ok?"Responder":"🔒 Responder"}</button>${ok?"":'<span class="hint">Conclua o Praticar para liberar.</span>'}</div>`}
function bindModes(id){app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{if(!b.disabled)lesson(id,b.dataset.m)})}
const strip=s=>norm(s).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
function respond(x,sp){
  stopSpeak();const id=x.id,t0=Date.now();let cur=0,helped=false,gained=0;
  app.innerHTML=`
  <div class="lesson-head"><button class="btn ghost" id="back">← Voltar</button><h2>${esc(x.title)}</h2><span class="pill" id="ptsPill">★ ${pts} pts</span></div>
  <span class="lvl">${LV[x.lv]} · Exit ${x.n} · Responder</span>
  ${modeBar(id,"r")}
  <div class="prog"><i id="pg"></i></div>
  <section class="panel" id="sents"></section>
  <section class="panel" id="typPanel">
    <label for="ans">Sua resposta em inglês</label>
    <textarea id="ans" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row"><button class="btn ghost" id="hint">💡 Dica</button><button class="btn ghost" id="show">👁 Ver resposta</button><button class="btn ghost" id="rep">🔊 Ouvir de novo</button>
    <span class="hint">Pontuação e maiúsculas não contam.</span></div>
    <div class="hint" id="help"></div>
  </section>`;
  if(history.state&&history.state.l)history.replaceState({l:id},"");else history.pushState({l:id},"");
  const goHome=()=>{if(history.state&&history.state.l)history.back();else home()};
  document.getElementById("back").onclick=goHome;bindModes(id);
  const box=document.getElementById("sents"),ans=document.getElementById("ans"),help=document.getElementById("help");
  const who=i=>`<span class="who${sp[1][i]==="Y"?" you":""}">${sp[1][i]==="Y"?"Você":esc(sp[0])}</span>`;
  const lastO=()=>{for(let k=cur-1;k>=0;k--)if(sp[1][k]==="O")return x.s[k][0];return ""};
  box.onclick=e=>{if(wordTap(e))return;const b=e.target.closest(".say");if(b)speak(x.s[+b.dataset.i][0])};
  document.getElementById("rep").onclick=()=>{const t=lastO();if(t)speak(t)};
  document.getElementById("hint").onclick=()=>{if(cur<x.s.length){helped=true;help.textContent="Dica: "+x.s[cur][0].split(" ").map(w=>w[0]+"_".repeat(Math.max(0,w.replace(/[^A-Za-z']/g,"").length-1))).join(" ")}};
  document.getElementById("show").onclick=()=>{if(cur<x.s.length){helped=true;help.textContent="Resposta: "+x.s[cur][0]}};
  function advance(){
    let spoke=[];
    while(cur<x.s.length&&sp[1][cur]==="O"){spoke.push(x.s[cur][0]);cur++}
    if(spoke.length){const go=k=>{if(k<spoke.length)speak(spoke[k],()=>go(k+1))};go(0)}
    render();
  }
  function render(){
    help.textContent="";ans.value="";ans.className="";
    box.innerHTML=x.s.map(([en,pt],i)=>{
      if(i<cur)return `<div class="sent">${who(i)}<div class="en donee">${words(en)}<button class="say" data-i="${i}" aria-label="Ouvir">🔊</button></div><div class="pt">${esc(pt)}</div></div>`;
      if(i===cur)return `<div class="sent cur">${who(i)}<div class="ask">Diga em inglês: “${esc(pt)}”</div></div>`;
      return "";
    }).join("");
    const fin=cur>=x.s.length;
    document.getElementById("typPanel").hidden=fin;
    document.querySelector(".prog").classList.toggle("full",fin);
    document.getElementById("pg").style.width=(cur/x.s.length*100)+"%";
    if(fin){
      if(!done[id+"R"]){gained=helped?10:20;pts+=gained}done[id+"R"]=true;persist();
      const sib=all().filter(y=>y.lv===x.lv),nx=sib[sib.findIndex(y=>y.id===id)+1];
      const min=Math.max(1,Math.round((Date.now()-t0)/60000));
      box.insertAdjacentHTML("afterend",`<section class="finish" id="finish">
        <h3>Conversa concluída! ✓</h3>
        <div class="big">${gained?"+"+gained+" pontos":"Revisão feita"}</div>
        <p>${helped?"Com ajuda":"Sem ajuda"} · ${min} min · Total: ${pts} pontos</p>
        <div class="row">${nx?'<button class="btn" id="nextL">Próxima lição →</button>':""}<button class="btn ghost" id="again">Refazer</button><button class="btn ghost" id="home2">Voltar à lista</button></div>
      </section>`);
      document.getElementById("ptsPill").textContent="★ "+pts+" pts";
      if(nx)document.getElementById("nextL").onclick=()=>lesson(nx.id);
      document.getElementById("again").onclick=()=>lesson(id,"r");
      document.getElementById("home2").onclick=goHome;
      document.getElementById("finish").scrollIntoView({behavior:"smooth",block:"center"});
    }else ans.focus();
  }
  ans.oninput=()=>{
    const a=strip(ans.value),t=strip(x.s[cur][0]);
    if(a===t){cur++;advance();return}
    ans.className=!a?"":t.startsWith(a)?"okk":"bad";
  };
  ans.onkeydown=e=>{if(e.key==="Enter")e.preventDefault()};
  advance();window.scrollTo(0,0);
}
if(history.state&&history.state.l)history.replaceState(null,"");
window.addEventListener("popstate",()=>{if(L.length)home()});
boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body></html>
