<style>
/* Layout: lista de "saídas" estilo placa de rodovia americana -> tela de digitação com tradução revelada abaixo */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#13201B; --muted:#5E6E67; --line:#D7DFDB;
  --sign:#0B6B47; --sign-ink:#FFFFFF; --ok:#137A3E; --bad:#C2352B; --pend:#9AA8A2; --pt:#2C4A9A;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211D; --ink:#E7EEEA; --muted:#93A39C; --line:#2A3832;
  --sign:#14875C; --sign-ink:#FFFFFF; --ok:#4CC27E; --bad:#FF7A6E; --pend:#5E6E67; --pt:#9DB5FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211D; --ink:#E7EEEA; --muted:#93A39C; --line:#2A3832;
  --sign:#14875C; --sign-ink:#FFFFFF; --ok:#4CC27E; --bad:#FF7A6E; --pend:#5E6E67; --pt:#9DB5FF; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1{font:800 clamp(28px,7vw,40px)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--sign)}
.sub{color:var(--muted);margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:700 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat{margin-left:auto;font:600 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.exit{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--sign);color:var(--sign-ink);border:2px solid var(--sign);outline:2px solid var(--sign-ink);outline-offset:-6px;border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit}
.exit:focus-visible{box-shadow:0 0 0 3px var(--ink)}
.exit .num{font:700 12px/1.1 var(--mono);text-transform:uppercase;letter-spacing:.08em;border:1.5px solid currentColor;border-radius:4px;padding:6px 7px;text-align:center;min-width:58px}
.exit .num b{display:block;font:800 20px var(--display);letter-spacing:0}
.exit .t{min-width:0;flex:1}
.exit .t strong{display:block;font:700 17px/1.25 var(--display)}
.exit .t small{opacity:.85;font-size:13px}
.exit .done{font:700 12px var(--mono);background:var(--sign-ink);color:var(--sign);border-radius:4px;padding:3px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.panel h2{font:700 18px var(--display);margin:0}
label{font:700 13px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
textarea,input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;font:17px/1.5 var(--mono)}
textarea:focus,input:focus{outline:none;border-color:var(--sign)}
.btn{background:var(--sign);color:var(--sign-ink);border:none;border-radius:8px;padding:10px 16px;font:700 15px var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:14px;color:var(--muted)}
.lesson-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lesson-head h2{font:800 24px/1.15 var(--display);margin:0;flex:1;min-width:0;text-wrap:balance}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sign);width:0;transition:width .25s}
.sent{display:grid;gap:4px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sent:last-child{border-bottom:none}
.en{font:17px/1.6 var(--mono);word-break:break-word}
.en .ok{color:var(--ok)} .en .bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent);border-radius:2px} .en .p{color:var(--pend)}
.en.donee{color:var(--ink)}
.pt{color:var(--pt);font-size:16px;min-height:1.5em}
.pt .h{color:transparent;background:var(--line);border-radius:3px}
.cur{background:color-mix(in srgb,var(--sign) 7%,transparent);border-radius:8px;padding:10px;border-bottom:none}
.hint{font-size:13px;color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.say{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;min-width:40px;min-height:36px;padding:4px 8px;font-size:17px;cursor:pointer;line-height:1}
.en.donee{display:flex;gap:10px;align-items:flex-start}
.en.donee .tx{min-width:0;flex:1;padding-top:4px}
.sbtn{display:flex;gap:4px;flex-shrink:0}
.revbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lvl{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.who{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.who.you{color:var(--sign)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .chip:disabled{opacity:.5;cursor:default}
.ask{font:600 15px var(--body);color:var(--pt);background:color-mix(in srgb,var(--pt) 8%,transparent);border-radius:6px;padding:6px 10px}
#ans.okk{border-color:var(--ok)} #ans.bad{border-color:var(--bad)}
.w{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted var(--muted)}
.w:focus-visible{outline:2px solid var(--sign)}
.tip{position:fixed;z-index:20;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font:600 15px var(--body);max-width:70vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.resume{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--sign);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit}
.resume b{font:700 16px var(--display);display:block}
.resume small{color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px;display:grid;gap:10px}
.modal h2{font:800 22px var(--display);margin:0}
.modal h3{font:700 16px var(--display);margin:6px 0 0}
.modal p,.modal li{margin:0;line-height:1.5}
.modal ul{margin:0;padding-left:20px;display:grid;gap:4px}
.auth{max-width:420px;margin:0 auto;display:grid;gap:14px;width:100%}
.auth .panel{gap:10px}
.tabs{display:flex;gap:6px}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.price{font:800 40px var(--display);color:var(--sign);line-height:1}
.tag{display:inline-block;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--sign) 14%,transparent);color:var(--sign);border-radius:4px;padding:4px 8px}
.pix{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 15px var(--mono);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;word-break:break-all}
.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.adm{display:grid;gap:8px}
.arow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.arow .who2{flex:1;min-width:180px}
.arow .who2 b{display:block}
.arow small{color:var(--muted);word-break:break-all}
.st{font:700 12px var(--mono);border-radius:4px;padding:3px 7px;white-space:nowrap}
.st.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st.wait{background:color-mix(in srgb,var(--pt) 15%,transparent);color:var(--pt)}
.st.req{background:color-mix(in srgb,#E8590C 18%,transparent);color:#C2410C}
.st.off{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.arow small.pline{display:block;color:var(--ink);margin-top:4px}
.mini{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--sign)}
select.chip{font:600 14px var(--body)}
.sign{position:relative;background:var(--sign);color:#fff;border-radius:10px;padding:6px;box-shadow:0 2px 0 rgba(0,0,0,.15);margin-top:16px;max-width:360px}
.sign .in{border:2.5px solid #fff;border-radius:6px;padding:10px 14px 12px;display:flex;align-items:center;gap:12px}
.sign .tab{position:absolute;top:-16px;left:14px;background:var(--sign);border:2.5px solid #fff;border-bottom:none;border-radius:6px 6px 0 0;padding:2px 10px 1px;font:900 12px "Overpass",system-ui,sans-serif;letter-spacing:.12em}
.sign .tx2{flex:1;min-width:0}
.sign small{display:block;font:800 13px "Overpass",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.sign b{display:block;font:900 clamp(30px,8vw,40px)/1 "Overpass",system-ui,sans-serif;letter-spacing:.01em}
.sign .arr{font:900 38px/1 "Overpass",system-ui,sans-serif;flex-shrink:0}
.signwrap{display:grid;gap:6px}
.exit .t small.bk{display:block;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.exit.lock{opacity:.55;filter:grayscale(.6)}
.sq{background:color-mix(in srgb,var(--sign-ink) 12%,transparent);border-radius:10px;padding:12px;display:grid;gap:8px;text-align:left}
.sqt{font:700 16px var(--body);margin:0}
.sqo{display:grid;gap:6px}
.sqo .btn{text-align:left;white-space:normal}
.finish .sqo .btn.ghost{color:var(--sign-ink);border-color:var(--sign-ink)}
.finish .sqo .btn.qok{background:var(--sign-ink);color:var(--sign);opacity:1}
.finish .sqo .btn.qbad{text-decoration:line-through;opacity:.7}
.sqw{margin:0;font-size:15px}
body.kids{--sign:#E8590C}
body.kids .en{font-size:22px}
body.kids .pt{font-size:19px}
body.kids #typ{font-size:21px}
body.kids .exit{border-radius:18px}
.kem{font-size:26px;line-height:1;flex-shrink:0;padding-top:2px}
.kemb{font-size:56px;line-height:1.1;text-align:center}
.ind h2{font-size:17px}
.knum{font-size:30px!important;line-height:1}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.stk{display:grid;justify-items:center;gap:4px;padding:10px 6px;border:2px dashed var(--line);border-radius:12px;text-align:center}
.stk span{font-size:34px}
.stk small{font-size:11px;color:var(--muted)}
.stk.off span{filter:grayscale(1);opacity:.4}
.kst{letter-spacing:4px}
.ksticker span{font-size:30px;vertical-align:middle}
.ii{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:5px;border-radius:50%;font:700 12px/1 var(--body);background:color-mix(in srgb,var(--pt) 16%,transparent);color:var(--pt);cursor:pointer;vertical-align:middle}
.chip[aria-pressed="true"] .ii{background:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg)}
.tip.info{max-width:min(300px,86vw);font:500 14px/1.45 var(--body)}
.lesson-head h2{flex:1 1 150px}
.tmr{position:relative;font:700 12px var(--mono);padding:4px 8px;border-radius:999px;background:conic-gradient(var(--sign) calc(var(--p,0)*360deg),var(--line) 0);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.tmr b{font:inherit}
.tmr::before{content:"";position:absolute;inset:2px;border-radius:999px;background:var(--surface);z-index:0}
.tmr>*,.tmr{isolation:isolate}
.tmr b,.tmr{z-index:1}
.tmr.paused{opacity:.55}
.tmr.done{background:var(--sign);color:var(--sign-ink)}
.tmr.done::before{display:none}
.prof{gap:8px}
.profrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.gem{font-size:18px}.gem b{font:800 20px var(--display)}.gem small{color:var(--muted);font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:grid;place-items:center;height:34px;border-radius:8px;border:1px solid var(--line);font:700 12px var(--mono);color:var(--muted)}
.wd.ok{background:color-mix(in srgb,var(--sign) 14%,transparent);border-color:var(--sign);font-size:16px}
.wd.now{outline:2px solid var(--sign);outline-offset:1px}
.todayb{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.price.strike{position:relative;display:inline-block;color:var(--muted);width:max-content}
.price .xx{position:absolute;inset:-4px -8px;pointer-events:none;font-size:0;background:linear-gradient(to top right,transparent calc(50% - 2.5px),#E03131 calc(50% - 2.5px),#E03131 calc(50% + 2.5px),transparent calc(50% + 2.5px)),linear-gradient(to bottom right,transparent calc(50% - 2.5px),#E03131 calc(50% - 2.5px),#E03131 calc(50% + 2.5px),transparent calc(50% + 2.5px))}
.free{font:800 26px var(--display);color:var(--ok)}
.nbadge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#E03131;color:#fff;font:800 12px/20px var(--body);text-align:center}
.inst{border:2px solid var(--sign)}
.inst h2{font-size:17px}
#splash{position:fixed;inset:0;z-index:100;background:#0A3161;display:grid;place-items:center;transition:opacity .45s ease}
#splash svg{position:absolute;inset:0;width:100%;height:100%}
#splash .sp-in{position:relative;padding:0 24px;width:min(360px,86vw);animation:spIn .7s cubic-bezier(.2,.8,.2,1.2) both}
#splash .sign{margin:0;max-width:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#splash.out{opacity:0}
@keyframes spIn{from{transform:scale(.6) translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .sp-in{animation:none}}
.menub{position:relative;font-size:26px;line-height:1;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex-shrink:0;align-self:flex-start;margin-top:16px}
.top{flex-wrap:nowrap}
.top .signwrap{min-width:0;flex:1}
.statline{justify-self:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:700 14px var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}
.drawer-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);transition:background .2s}
.drawer-bg.on{background:rgba(0,0,0,.45)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(300px,84vw);background:var(--surface);color:var(--ink);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:grid;align-content:start;gap:6px;transform:translateX(100%);transition:transform .2s ease;box-shadow:-8px 0 24px rgba(0,0,0,.2);overflow:auto}
.drawer-bg.on .drawer{transform:none}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:12px 10px;font:600 16px var(--body);color:var(--ink);cursor:pointer}
.mi:hover,.mi:focus-visible{background:color-mix(in srgb,var(--sign) 10%,transparent)}
.mi span:first-child{width:26px;text-align:center;font-size:20px}
.nbadge.in{position:static;margin-left:auto}
@media (prefers-reduced-motion:reduce){.drawer,.drawer-bg{transition:none}}
.pill{font:700 13px var(--mono);background:var(--sign);color:var(--sign-ink);border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.finish{background:var(--sign);color:var(--sign-ink);outline:2px solid var(--sign-ink);outline-offset:-7px;border-radius:12px;padding:22px 18px;display:grid;gap:10px;text-align:center;animation:pop .45s ease-out}
.finish h3{font:800 26px/1.1 var(--display);margin:0}
.finish .big{font:800 34px var(--display)}
.finish p{margin:0;opacity:.9}
.finish .row{justify-content:center}
.finish .btn{background:var(--sign-ink);color:var(--sign)}
.finish .btn.ghost{background:transparent;color:var(--sign-ink);border-color:var(--sign-ink)}
.prog.full i{background:var(--ok);animation:flash .5s 3}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
@keyframes flash{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.finish,.prog.full i{animation:none}}
</style>

function voiceFor(w){
  if(!w)return {v:VN||voice,p:1};
  const n=w.name||"";
  if(w.kid)return {v:VF||voice,p:1.45};
  if(n==="Lobo")return {v:VM||voice,p:.6};
  if(/^(Porquinho|Lebre|Ursinho)$/.test(n))return {v:VF||voice,p:1.6};
  if(w.you)return {v:VM||voice,p:VM?1:.85};
  if(FEMN.test(n))return {v:VF||voice,p:VF?1:1.3};
  if(n==="Narrador")return {v:VN||voice,p:1};
  return {v:(VM&&VF?VM:voice),p:VM?.9:.75};
}
function whoOf(x,i){

}

let playTok=0;
function playAll(x,btn){
  const lbl=btn.dataset.lbl||(btn.dataset.lbl=btn.textContent);
  if(btn.dataset.on){playTok++;stopSpeak();btn.dataset.on="";btn.textContent=lbl;return}
  const tok=++playTok;btn.dataset.on="1";btn.textContent="■ Parar";let k=0;
  const go=()=>{if(tok!==playTok)return;if(k>=x.s.length){btn.dataset.on="";btn.textContent=lbl;return}speak(x.s[k][0],go,null,whoOf(x,k++))};go();
}
function album(){
  const k=all().filter(x=>x.lv==="k"),got=k.filter(x=>done[x.id]).length;
  return `<section class="panel"><h2>⭐ Meu álbum de figurinhas</h2><p class="msg">${got} de ${k.length} figurinhas. Conclua lições para ganhar mais!</p><div class="alb">${k.map(x=>`<div class="stk${done[x.id]?"":" off"}" title="${esc(x.title)}"><span>${done[x.id]?x.em:"❔"}</span><small>${esc(x.title)}</small></div>`).join("")}</div></section>`;
}
const INFO={
 all:"Todas as lições de adulto. Escolha um nível nos filtros ao lado.",
 b:"Básico: diálogos simples do dia a dia e do trabalho. Ótimo para começar.",
 i:"Intermediário: situações mais completas, como entrevista, médico, aluguel e oficina.",
 a:"Avançado: negociação, contratos, impostos e conversas mais longas.",
 v:"Vocabulário: palavras por tema (corpo, casa, carro, comida…) em frases curtas.",
 t:"Textos: a história do Yuri nos EUA, do fácil ao avançado. Bom para treinar leitura.",
 h:"Histórias: livros clássicos em capítulos. Responda à pergunta no fim de cada um para liberar o próximo.",
 m:"Meus textos: cole pequenas histórias, letras de música, e-mails, mensagens ou o que quiser. O app traduz e cria uma lição para você praticar.",
 kall:"Todas as lições Kids.",
 escola:"Frases para usar na escola, com a professora e os amigos.",
 casa:"Frases para falar com a mamãe e o papai em casa.",
 uteis:"Palavras úteis com desenho. Ao digitar, o app fala a palavra em inglês e o significado em português.",
 frases:"Frases que usam as palavras úteis no dia a dia.",
 palavras:"Vocabulário: animais, cores, números, brinquedos, comidas e corpo.",
 historias:"Histórias infantis clássicas em inglês simples.",
 album:"Seu álbum: cada lição concluída dá uma figurinha.",
 meta:"Meta do dia: estude 5 minutos em qualquer lição. O relógio pausa se você ficar 1 minuto sem mexer. Cada meta cumprida vale um prêmio, e os dias seguidos contam a sua sequência 🔥.",
 resp:"Responder: o personagem fala e você responde de memória. Libera depois de concluir o Praticar.",
 spd:"Velocidade da voz: normal, lenta ou bem lenta. O 🐢 ao lado de cada frase sempre fala bem devagar.",
 ind:"Indique e ganhe: mande seu link. Quando um amigo assinar, você ganha 30 dias grátis."
};
function infoBtn(k){return `<span class="ii" role="button" tabindex="0" data-info="${k}" aria-label="O que é isso?">ⓘ</span>`}
document.addEventListener("click",e=>{
  const b=e.target.closest(".ii");if(!b)return;e.stopPropagation();e.preventDefault();closeTip();
  tipEl=document.createElement("div");tipEl.className="tip info";tipEl.textContent=INFO[b.dataset.info]||"";document.body.appendChild(tipEl);
  const r=b.getBoundingClientRect(),tw=tipEl.offsetWidth;tipEl.style.left=Math.max(8,Math.min(innerWidth-tw-8,r.left+r.width/2-tw/2))+"px";tipEl.style.top=(r.bottom+8+tipEl.offsetHeight>innerHeight?r.top-tipEl.offsetHeight-8:r.bottom+8)+"px";
},true);
function statLine(){const k=dkey(),s=today0.d===k?today0.s:0,ok=goal.days[k];
  return `<button class="statline" id="statL" type="button">${ok?"👍 Meta de hoje":"⏱ "+fmtT(s)+"/5:00"} · ${gemIcon()} ${goal.gems||0} · 🔥 ${streak()} · ★ ${pts}</button>`}
function sheet(title,html,after){
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<div class="modal" role="dialog" aria-label="${esc(title)}"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button class="btn ghost" data-x="1" aria-label="Fechar">✕</button></div>${html}</div>`;
  document.body.appendChild(o);o.addEventListener("click",e=>{if(e.target===o||e.target.closest("[data-x]"))o.remove()});
  after&&after(o);return o;
}
function openMenu(){
  const it=[["perfil","👤","Meu perfil"],isAdmin?null:["ind","🎁","Indique e ganhe"],plano!=="kids"?["textos","✍️","Meus textos"]:null,(isStandalone()||load("ee_inst",0))?null:["inst","📲","Instalar o app"],["ajuda","ℹ","Ajuda"],isAdmin?["alunos","👥","Alunos"]:null,["sair","🚪","Sair"]].filter(Boolean);
  const o=document.createElement("div");o.className="drawer-bg";
  o.innerHTML=`<nav class="drawer" aria-label="Menu"><div class="row" style="justify-content:space-between"><b>Menu</b><button class="btn ghost" data-x="1" aria-label="Fechar">✕</button></div>${sess&&sess.email?`<p class="hint">${esc(sess.nome||sess.email)}</p>`:""}
  ${it.map(([k,i,t])=>`<button class="mi" data-mi="${k}"><span>${i}</span>${t}${k==="alunos"?`<span class="nbadge in" id="admBadge2" ${lastN?"":"hidden"}>${lastN}</span>`:""}</button>`).join("")}</nav>`;
  document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add("on"));
  const close=()=>{o.classList.remove("on");setTimeout(()=>o.remove(),200)};
  o.addEventListener("click",e=>{
    if(e.target===o||e.target.closest("[data-x]"))return close();
    const m=e.target.closest("[data-mi]");if(!m)return;close();const k=m.dataset.mi;
    if(k==="perfil")sheet("👤 Meu perfil",profileHtml()+`<p class="msg">★ ${pts} pontos no total</p>`);
    if(k==="ind")sheet("🎁 Indique e ganhe",indPanel(),()=>{if(ind)bindInd();else loadInd()});
    if(k==="textos"){filter="m";home();window.scrollTo(0,0)}
    if(k==="inst")sheet("📲 Instalar o app",installBanner(true));
    if(k==="ajuda")showInfo();
    if(k==="alunos")adminScreen();
    if(k==="sair")logout();
  });
}
function prevCh(x){if(x.lv!=="h")return null;const a=all(),i=a.findIndex(y=>y.id===x.id);const p=a[i-1];return p&&p.book===x.book?p:null}
function locked(x){const p=prevCh(x);return !!(p&&!done[p.id])}
function storyQ(x,id){
  const q=x.q;if(!q)return "";const ans=done[id+"Q"];
  return `<div class="sq" id="sq"><p class="sqt">🤔 ${esc(q.t)}</p><div class="sqo">${q.o.map((o,i)=>`<button class="btn ghost" data-qa="${i}" ${ans!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div><p class="sqw" id="sqw" ${ans!=null?"":"hidden"}>${ans!=null?(ans===true?"✓ Acertou! ":"✗ ")+esc(q.w):""}</p></div>`;
}
function bindQ(x,id,onPts){
  const box=document.getElementById("sq");if(!box)return;
  box.querySelectorAll("[data-qa]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.qa,ok=i===x.q.c;
    box.querySelectorAll("[data-qa]").forEach(z=>{z.disabled=true;if(+z.dataset.qa===x.q.c)z.classList.add("qok");else if(z===b)z.classList.add("qbad")});
    const w=document.getElementById("sqw");w.hidden=false;w.textContent=(ok?"✓ Acertou! +5 pontos. ":"✗ Não foi dessa vez. ")+x.q.w;
    if(done[id+"Q"]==null){done[id+"Q"]=ok;if(ok){pts+=5;onPts&&onPts()}persist()}
  });
}
function modeBar(id,m){const ok=!!done[id];return `<div class="modes"><button class="chip" data-m="p" aria-pressed="${m==="p"}">Praticar</button><button class="chip" data-m="r" aria-pressed="${m==="r"}" ${ok?"":"disabled"}>${ok?"Responder":"🔒 Responder"}</button>${infoBtn("resp")}${ok?"":'<span class="hint">Conclua o Praticar para liberar.</span>'}</div>`}
function bindModes(id){app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{if(!b.disabled)lesson(id,b.dataset.m)})}
const strip=s=>norm(s).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
function respond(x,sp){
  stopSpeak();const id=x.id,t0=Date.now();let cur=0,helped=false,gained=0;
  app.innerHTML=`
  <div class="lesson-head"><button class="btn ghost" id="back">← Voltar</button><h2>${esc(x.title)}</h2>${timerHtml()}<span class="pill" id="ptsPill">★ ${pts} pts</span></div>
  <span class="lvl">${LV[x.lv]} · Exit ${x.n} · Responder</span>
  ${modeBar(id,"r")}
  <div class="prog"><i id="pg"></i></div>
  <section class="panel" id="sents"></section>
  <section class="panel" id="typPanel">
    <label for="ans">Sua resposta em inglês</label>
    <textarea id="ans" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row"><button class="btn ghost" id="hint">💡 Dica</button><button class="btn ghost" id="show">👁 Ver resposta</button><button class="btn ghost" id="rep">🔊 Ouvir de novo</button>
    <span class="hint">Pontuação e maiúsculas não contam.</span></div>
    <div class="hint" id="help"></div>
  </section>`;
  if(history.state&&history.state.l)history.replaceState({l:id},"");else history.pushState({l:id},"");
  const goHome=()=>{if(history.state&&history.state.l)history.back();else home()};
  document.getElementById("back").onclick=goHome;bindModes(id);
  const box=document.getElementById("sents"),ans=document.getElementById("ans"),help=document.getElementById("help");
  const who=i=>`<span class="who${sp[1][i]==="Y"?" you":""}">${sp[1][i]==="Y"?"Você":esc(sp[0])}</span>`;
  const lastO=()=>{for(let k=cur-1;k>=0;k--)if(sp[1][k]==="O")return k;return -1};
  box.onclick=e=>{if(wordTap(e))return;const b=e.target.closest(".say");if(b)speak(x.s[+b.dataset.i][0],null,b.dataset.slow?.5:null,whoOf(x,+b.dataset.i))};
  document.getElementById("rep").onclick=()=>{const k=lastO();if(k>=0)speak(x.s[k][0],null,null,whoOf(x,k))};
  document.getElementById("hint").onclick=()=>{if(cur<x.s.length){helped=true;help.textContent="Dica: "+x.s[cur][0].split(" ").map(w=>w[0]+"_".repeat(Math.max(0,w.replace(/[^A-Za-z']/g,"").length-1))).join(" ")}};
  document.getElementById("show").onclick=()=>{if(cur<x.s.length){helped=true;help.textContent="Resposta: "+x.s[cur][0]}};
  function advance(){
    let spoke=[];
    while(cur<x.s.length&&sp[1][cur]==="O"){spoke.push(cur);cur++}
    if(spoke.length){const go=k=>{if(k<spoke.length)speak(x.s[spoke[k]][0],()=>go(k+1),null,whoOf(x,spoke[k]))};go(0)}
    render();
  }
  function render(){
    help.textContent="";ans.value="";ans.className="";
    box.innerHTML=x.s.map(([en,pt],i)=>{
      if(i<cur)return `<div class="sent">${who(i)}<div class="en donee"><span class="sbtn"><button class="say" data-i="${i}" aria-label="Ouvir">🔊</button><button class="say" data-i="${i}" data-slow="1" aria-label="Ouvir bem devagar">🐢</button></span><span class="tx">${words(en)}</span></div><div class="pt">${esc(pt)}</div></div>`;
      if(i===cur)return `<div class="sent cur">${who(i)}<div class="ask">Diga em inglês: “${esc(pt)}”</div></div>`;
      return "";
    }).join("");
    const fin=cur>=x.s.length;
    document.getElementById("typPanel").hidden=fin;
    document.querySelector(".prog").classList.toggle("full",fin);
    document.getElementById("pg").style.width=(cur/x.s.length*100)+"%";
    if(fin){
      if(!done[id+"R"]){gained=helped?10:20;pts+=gained}done[id+"R"]=true;persist();
      const sib=all().filter(y=>y.lv===x.lv),nx=sib[sib.findIndex(y=>y.id===id)+1];
      const min=Math.max(1,Math.round((Date.now()-t0)/60000));
      box.insertAdjacentHTML("afterend",`<section class="finish" id="finish">
        <h3>Conversa concluída! ✓</h3>
        <div class="big">${gained?"+"+gained+" pontos":"Revisão feita"}</div>
        <p>${helped?"Com ajuda":"Sem ajuda"} · ${min} min · Total: ${pts} pontos</p>
        <div class="row"><button class="btn" id="laF">▶ Ouvir conversa inteira</button>${nx?'<button class="btn" id="nextL">Próxima lição →</button>':""}<button class="btn ghost" id="again">Refazer</button><button class="btn ghost" id="home2">Voltar à lista</button></div>
      </section>`);
      document.getElementById("ptsPill").textContent="★ "+pts+" pts";
      document.getElementById("laF").onclick=e=>playAll(x,e.currentTarget);
      if(nx)document.getElementById("nextL").onclick=()=>lesson(nx.id);
      document.getElementById("again").onclick=()=>lesson(id,"r");
      document.getElementById("home2").onclick=goHome;
      document.getElementById("finish").scrollIntoView({behavior:"smooth",block:"center"});
    }else ans.focus();
  }
  ans.oninput=()=>{
    const a=strip(ans.value),t=strip(x.s[cur][0]);
    if(a===t){cur++;advance();return}
    ans.className=!a?"":t.startsWith(a)?"okk":"bad";
  };
  ans.onkeydown=e=>{if(e.key==="Enter")e.preventDefault()};
  advance();window.scrollTo(0,0);
}
if(history.state&&history.state.l)history.replaceState(null,"");
window.addEventListener("popstate",()=>{if(L.length)home()});
boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
